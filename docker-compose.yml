services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    env_file: .env
    volumes:
      - ./backend:/app/backend
    ports:
      - "8181:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5273:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
